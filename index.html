<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Авторизация</title>
  <style>
    * {
      box-sizing: border-box;
      transition: all 0.3s ease;
    }
    body {
      background: #0f0f13;
      color: #ffffff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .card {
      background: #18181b;
      padding: 32px 24px;
      border-radius: 20px;
      width: 340px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      border: 1px solid #27272a;
      transform: translateY(0);
      animation: fadeIn 0.5s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h2 {
      margin-top: 0;
      text-align: center;
      font-size: 24px;
      letter-spacing: 0.5px;
      color: #f4f4f5;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      margin: 8px 0;
      border-radius: 12px;
      border: 1px solid #27272a;
      background: #27272a;
      color: white;
      font-size: 15px;
      outline: none;
    }
    input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      border-radius: 12px;
      border: none;
      background: #6366f1;
      color: white;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }
    button:hover {
      background: #4f46e5;
      transform: translateY(-1px);
    }
    button:active {
      transform: translateY(1px);
    }
    #error {
      color: #ef4444;
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
      min-height: 18px;
    }
    .toggle-link {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      color: #a1a1aa;
      cursor: pointer;
    }
    .toggle-link:hover {
      color: #e4e4e7;
    }
    .success-box {
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }
    .success-box h2 {
      color: #22c55e;
    }
    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto 0 auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<div class="card" id="formCard">
  <h2 id="title">Вход в игру</h2>
  
  <div id="loadingCheck" class="spinner"></div>

  <div id="inputsContainer" style="display: none;">
    <input type="text" id="nickname" placeholder="Никнейм" style="display: none;">
    <input type="email" id="email" placeholder="Эл. почта">
    <input type="password" id="password" placeholder="Пароль">
    <button id="submitBtn" onclick="handleAuth()">Войти</button>
  </div>

  <div id="error"></div>
  <div class="toggle-link" onclick="toggleMode()" id="toggleText" style="display: none;">Нет аккаунта? Регистрация</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBAx10SsLG5ClLzT71Fex4NgpkP5VtvOC4",
    authDomain: "my-superai-app.firebaseapp.com",
    projectId: "my-superai-app",
    databaseURL: "https://my-superai-app-default-rtdb.firebaseio.com"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  let isRegister = false;

  const errBox = document.getElementById('error');

  // ГЛАВНАЯ МАГИЯ: Автоматическая проверка, входил ли игрок ранее
  onAuthStateChanged(auth, (user) => {
    document.getElementById('loadingCheck').style.display = 'none';
    
    if (user) {
      // Игрок уже входил! Сессия активна.
      const name = user.displayName || "Игрок";
      showSuccess(name);
    } else {
      // Никто не вошел — показываем форму ввода
      document.getElementById('inputsContainer').style.display = 'block';
      document.getElementById('toggleText').style.display = 'block';
    }
  });

  window.toggleMode = function() {
    isRegister = !isRegister;
    errBox.innerText = "";
    document.getElementById('title').innerText = isRegister ? 'Регистрация' : 'Вход в игру';
    document.getElementById('submitBtn').innerText = isRegister ? 'Создать аккаунт' : 'Войти';
    document.getElementById('toggleText').innerText = isRegister ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Регистрация';
    document.getElementById('nickname').style.display = isRegister ? 'block' : 'none';
  }

  window.handleAuth = async function() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const nickname = document.getElementById('nickname').value.trim();
    
    errBox.innerText = "";

    if (!email || !password) {
      errBox.innerText = "Заполни все поля!";
      return;
    }

    if (isRegister && !nickname) {
      errBox.innerText = "Введи никнейм!";
      return;
    }

    document.getElementById('submitBtn').innerText = "Подожди...";

    try {
      let user;
      if (isRegister) {
        const res = await createUserWithEmailAndPassword(auth, email, password);
        user = res.user;
        await updateProfile(user, { displayName: nickname });
      } else {
        const res = await signInWithEmailAndPassword(auth, email, password);
        user = res.user;
      }
      
      showSuccess(user.displayName || nickname || "Игрок");

    } catch (e) {
      document.getElementById('submitBtn').innerText = isRegister ? 'Создать аккаунт' : 'Войти';
      // Красиво переводим основные ошибки Firebase на русский для удобства
      if (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found') {
        errBox.innerText = "Неверная почта или пароль";
      } else if (e.code === 'auth/email-already-in-use') {
        errBox.innerText = "Эта почта уже занята";
      } else if (e.code === 'auth/weak-password') {
        errBox.innerText = "Пароль слишком слабый (минимум 6 символов)";
      } else {
        errBox.innerText = "Ошибка: " + e.message;
      }
    }
  }

  function showSuccess(name) {
    document.getElementById('formCard').innerHTML = `
      <div class="success-box">
        <h2>Вход выполнен!</h2>
        <p style="color: #a1a1aa; margin: 8px 0 0 0;">Рады видеть тебя снова, <b>${name}</b>!</p>
        <div class="spinner" style="margin-top: 16px;"></div>
      </div>
    `;
  }
</script>

</body>
</html>
