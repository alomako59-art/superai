<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход в аккаунт</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body {
      margin: 0; padding: 20px;
      background-color: #131316; color: #ffffff;
      display: flex; justify-content: center; align-items: center;
      height: 100vh;
    }
    .card {
      background: #1e1e24; padding: 24px; border-radius: 16px;
      width: 100%; max-width: 360px; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    h2 { margin-top: 0; text-align: center; font-size: 22px; }
    input {
      width: 100%; padding: 12px; margin: 8px 0;
      border-radius: 10px; border: 1px solid #333;
      background: #2a2a32; color: white; font-size: 16px;
    }
    button {
      width: 100%; padding: 12px; margin-top: 12px;
      border-radius: 10px; border: none;
      background: #4f46e5; color: white; font-size: 16px;
      font-weight: bold; cursor: pointer;
    }
    button:active { background: #4338ca; }
    .toggle {
      text-align: center; margin-top: 16px; font-size: 14px;
      color: #a1a1aa; cursor: pointer; text-decoration: underline;
    }
    #error { color: #f87171; font-size: 14px; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>

<div class="card">
  <h2 id="title">Вход</h2>
  <input type="text" id="nickname" placeholder="Никнейм" style="display: none;">
  <input type="email" id="email" placeholder="Почта (Email)">
  <input type="password" id="password" placeholder="Пароль (от 6 символов)">
  <button id="submitBtn" onclick="handleAuth()">Войти</button>
  <div id="error"></div>
  <div class="toggle" id="toggleText" onclick="toggleMode()">Нет аккаунта? Зарегистрироваться</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

 const firebaseConfig = {
    apiKey: "AIzaSyBAx10SsLG5ClLzT71Fex4NgpkP5VtvOC4",
    authDomain: "my-superai-app.firebaseapp.com",
    projectId: "my-superai-app",
    storageBucket: "my-superai-app.firebasestorage.app",
    messagingSenderId: "1015962301826",
    appId: "1:1015962301826:web:c0519e2c61aefe1ff58b9b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  let isRegister = false;

  window.toggleMode = function() {
    isRegister = !isRegister;
    document.getElementById('title').innerText = isRegister ? 'Регистрация' : 'Вход';
    document.getElementById('submitBtn').innerText = isRegister ? 'Создать аккаунт' : 'Войти';
    document.getElementById('toggleText').innerText = isRegister ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться';
    document.getElementById('nickname').style.display = isRegister ? 'block' : 'none';
    document.getElementById('error').innerText = '';
  }

  window.handleAuth = async function() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const nickname = document.getElementById('nickname').value.trim();
    const errorBox = document.getElementById('error');
    errorBox.innerText = 'Загрузка...';

    try {
      let userCredential;
      if (isRegister) {
        if (!nickname) throw new Error("Введи никнейм!");
        userCredential = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(userCredential.user, { displayName: nickname });
      } else {
        userCredential = await signInWithEmailAndPassword(auth, email, password);
      }

      const user = userCredential.user;
      const finalName = user.displayName || nickname || "Пользователь";
      
      document.title = "AUTH_OK|" + user.uid + "|" + finalName;
      window.location.href = "catroid://auth?uid=" + user.uid + "&name=" + encodeURIComponent(finalName);

    } catch (err) {
      errorBox.innerText = "Ошибка: " + err.message;
    }
  }
</script>

</body>
</html>
